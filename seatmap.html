<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B787-9 機材・座席表 | STA</title>
  <style>
    :root{--n:#06377d;--b:#0878d7;--i:#13233b}*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}a{text-decoration:none;color:inherit}.top{height:5px;background:#0878d7}.head{max-width:1120px;min-height:78px;margin:auto;padding:10px 22px;display:flex;align-items:center;gap:24px;background:#fff}.logo{width:182px}.logo img{display:block;width:100%}header{background:#fff}.head nav{display:flex;gap:18px;margin-left:auto;font-size:14px;font-weight:700}.reserve{padding:12px!important;border-radius:4px;background:#e45224;color:#fff}.mast{padding:48px max(22px,calc((100% - 1076px)/2));background:#06377d;color:#fff}.main{max-width:1120px;margin:auto;padding:42px 22px 80px}.lead{line-height:1.8;color:#53647a}.layout{display:grid;grid-template-columns:.85fr 1.35fr;gap:28px;margin-top:28px}.spec,.map{padding:25px;background:#fff;box-shadow:0 5px 20px #113c6910}.spec h2,.map h2{margin-top:0;color:var(--n)}table{width:100%;border-collapse:collapse}th,td{padding:12px 4px;border-bottom:1px solid #dbe6ef;text-align:left;font-size:14px}th{width:38%;color:#53708a}.livery{margin-top:20px;padding:16px;background:#0757a2;color:#fff;line-height:1.7}.legend{font-size:12px;color:#40617d}.cabin{max-width:530px;margin:16px auto;border:3px solid #9db9d1;border-radius:100px 100px 25px 25px;padding:45px 30px 25px;background:linear-gradient(90deg,#e9f5fd 0 15%,#fff 15% 85%,#e9f5fd 85%)}.zone{padding:14px 0;border-top:1px solid #b8cde0}.zone h3{text-align:center;color:#356693;font-size:12px}.row{max-width:420px;margin:5px auto;display:grid;grid-template-columns:repeat(3,1fr) 30px repeat(3,1fr);gap:5px}.aisle{padding-top:8px;color:#8ca4b8;text-align:center;font-size:10px}.seat{height:30px;border:0;border-radius:3px;background:#75bad5;color:#083a68;font-size:11px;font-weight:800;cursor:pointer}.seat:hover,.seat:focus{background:#f0b934;color:#342300}.biz .seat{background:#236db6;color:#fff}.note{min-height:70px;margin-top:18px;padding:14px;background:#eaf5ff;border-left:4px solid #0b8fd0;line-height:1.7;font-size:14px}footer{padding:32px;background:#062a60;color:#dceafd;text-align:center;font-size:12px;line-height:1.8}@media(max-width:820px){.layout{grid-template-columns:1fr}.logo{width:132px}.head nav{gap:10px;font-size:11px}.reserve{padding:9px!important}}@media(max-width:560px){nav a:not(.reserve){display:none}.cabin{padding:40px 10px 20px}.row{gap:3px;grid-template-columns:repeat(3,1fr) 20px repeat(3,1fr)}}
  </style>
  <link rel="stylesheet" href="portal.css">
  <script src="portal.js" defer></script>
</head>
<body>
  <div class="top"></div>
  <header><div class="head"><a class="logo" href="index.html"><img src="assets/stalogo-blue.png" alt="STA Shibaura Tech Airways"></a><nav><a href="index.html">ホーム</a><a href="destinations.html">就航都市・ガイド</a><a href="seatmap.html">機材・座席表</a><a href="access.html">搭乗口・アクセス</a><a class="reserve" href="https://hisaki-akira.github.io/ticket-system/">空席照会・予約（無料）</a></nav></div></header>
  <section class="page-header"><div class="container"><p class="page-category">AIRCRAFT &amp; SEATMAP</p><h1 class="page-title">機材・座席表案内</h1><p class="page-subtitle">ボーイング787-9（しばかっしー特別塗装機）のキャビン配置</p></div></section>
  <main class="classroom-layout">
  <section class="classroom-cabin seat-only-cabin" aria-label="B787-9 座席表">
    <section class="seat-zone" aria-label="エコノミークラス座席">
      <p class="seat-zone-title">ECONOMY CLASS · 3-3 配列 / 中央通路</p>
      <div id="seat-grid" class="seat-grid"></div>
    </section>
  </section>
</main>
  <footer><div class="footer-inner"><div class="footer-brand">STA <span>Shibaura Tech Airways</span></div><nav class="footer-nav"><a href="#">企業情報</a><a href="#">お問い合わせ</a><a href="#">プライバシーポリシー</a></nav><p>※STAは増穂祭（芝浦工業大学柏中学校 3-E）限定の架空の航空会社です</p></div></footer>
  <script>
const seatGrid = document.querySelector('#seat-grid');
if (seatGrid) {
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const tips = ['シートピッチ快適。ゆったりとVR体験を楽しめます。', 'メインスクリーンが見やすいおすすめ座席です。', '通路側。入退室しやすく、移動もスムーズです。', '没入感のあるバーチャル飛行体験をお楽しみください。'];
  for (let row = 1; row <= 6; row += 1) {
    const rowEl = document.createElement('div');
    rowEl.className = 'seat-row';
    letters.forEach((letter, index) => {
      if (index === 3) { const aisle = document.createElement('span'); aisle.className = 'aisle'; aisle.textContent = '通路'; rowEl.appendChild(aisle); }
      if (row === 6 && letter === 'D') { const empty = document.createElement('div'); empty.className = 'empty-seat'; empty.innerHTML = '動線<br>確保'; rowEl.appendChild(empty); return; }
      const seat = document.createElement('button');
      const number = `${row}${letter}`;
      seat.type = 'button'; seat.className = 'class-seat'; seat.textContent = number;
      const tip = document.createElement('span'); tip.className = 'seat-tip'; tip.textContent = tips[(row + index) % tips.length];
      seat.appendChild(tip); rowEl.appendChild(seat);
    });
    seatGrid.appendChild(rowEl);
  }
}
</script>
</body>
</html>
